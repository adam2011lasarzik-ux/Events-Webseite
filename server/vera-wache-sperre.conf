# === VORUEBERGEHEND, solange die Webseite passwortgeschuetzt ist ===
#
# Abgelegt auf dem Server als
#   /etc/systemd/system/vera-wache.service.d/sperre.conf
#
# Die Wache prueft sonst https://veraevents.de/ und bekaeme dort 401
# -> Alarmmail alle 15 Minuten, obwohl nichts kaputt ist. Am 15.09.2026
# ist genau das einmal passiert, bevor diese Datei existierte.
#
# /admin/login ist von der Sperre ausgenommen und beweist dieselbe
# Kette: Nginx, Zertifikat, Next.js, fertig gerenderte Seite.
#
# ZUSAMMEN MIT DER SPERRE WIEDER ENTFERNEN:
#   rm -rf /etc/systemd/system/vera-wache.service.d
#   systemctl daemon-reload

[Service]
Environment=VERA_WACHE_ADRESSE=https://veraevents.de/admin/login
