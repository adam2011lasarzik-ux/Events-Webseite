# ---------------------------------------------------------------
#  IP-Adressen im Nginx-Protokoll kürzen
#
#  Das Problem: Nginx schreibt in der Voreinstellung von Ubuntu für
#  JEDEN Aufruf die vollständige IP-Adresse mit. Das sind
#  personenbezogene Daten, sie fallen auch ohne Anmeldung an, und sie
#  bleiben durch die Rotation (täglich, 14 Generationen) rund zwei
#  Wochen liegen.
#
#  WICHTIG — was hier NICHT passiert: Die Bremse gegen
#  Massenanmeldungen (5 Versuche je Stunde, 10 am Admin-Login) benutzt
#  dieses Protokoll gar nicht. Sie wertet die Kopfzeile
#  X-Forwarded-For aus, die Nginx an die Anwendung weitergibt
#  (proxy_set_header X-Forwarded-For $remote_addr). Diese Zeile bleibt
#  unangetastet. Das Kürzen im Protokoll schwächt den
#  Missbrauchsschutz also nicht ab — auf dem Server nachgeprüft, nicht
#  angenommen.
#
#  Einbau (als root, Schritt für Schritt):
#    1. Diese Datei nach /etc/nginx/conf.d/vera-protokoll.conf
#    2. In /etc/nginx/nginx.conf aus
#         access_log /var/log/nginx/access.log;
#       wird
#         access_log /var/log/nginx/access.log gekuerzt;
#    3. nginx -t   (MUSS vorher fehlerfrei sein)
#    4. systemctl reload nginx
#
#  Gegenprobe danach:
#    curl -s -o /dev/null https://veraevents.de/
#    tail -n 1 /var/log/nginx/access.log
#  Erwartet: Die Adresse endet auf .0, und am Zeilenende steht host=…
# ---------------------------------------------------------------

# Letztes Byte der IPv4-Adresse auf 0 setzen, bei IPv6 die hinteren
# Gruppen verwerfen. Die Herkunft bleibt grob erkennbar — nützlich,
# wenn man einen Angriff nachvollziehen will —, die einzelne Person
# nicht mehr. Die erste passende Zeile gewinnt, deshalb steht IPv4
# oben.
map $remote_addr $ip_gekuerzt {
    ~(?<ipv4>\d+\.\d+\.\d+)\.    "$ipv4.0";
    ~(?<ipv6>[^:]+:[^:]+):       "$ipv6::";
    default                      "0.0.0.0";
}

# Wie das Standardformat "combined", mit zwei Unterschieden:
# gekürzte Adresse statt $remote_addr, und die Host-Kennung am Ende.
#
# Die Host-Kennung fehlte bisher — deshalb liess sich ein einzelner
# 404 auf der Startseite nicht mehr aufklären: Man konnte nicht sehen,
# unter welchem Namen die Anfrage hereinkam. Künftig steht es dabei.
log_format gekuerzt '$ip_gekuerzt - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" host=$host';
