# ---------------------------------------------------------------
#  IP-Adressen im Nginx-Protokoll kürzen
#
#  NOCH NICHT AKTIV. Diese Datei liegt bereit, damit die Umstellung
#  eine Zwei-Minuten-Sache ist, sobald entschieden ist (siehe
#  docs/rechtliches.md, Punkt 2).
#
#  Das Problem: Nginx schreibt in der Voreinstellung von Ubuntu für
#  JEDEN Aufruf die vollständige IP-Adresse mit. Das sind
#  personenbezogene Daten, und sie fallen auch dann an, wenn sich
#  niemand anmeldet.
#
#  Wichtig — was hier NICHT passiert: Die Bremse gegen
#  Massenanmeldungen (5 Versuche je Stunde und Adresse) arbeitet
#  NICHT mit diesem Protokoll, sondern mit der Kopfzeile
#  X-Forwarded-For, die die Anwendung selbst auswertet. Das Kürzen im
#  Protokoll schwächt den Missbrauchsschutz also nicht ab.
#
#  Einbauen (als root):
#    cp nginx-protokoll-kuerzen.conf /etc/nginx/conf.d/protokoll.conf
#    # im Server-Block von /etc/nginx/sites-available/vera ergänzen:
#    #   access_log /var/log/nginx/access.log gekuerzt;
#    nginx -t && systemctl reload nginx
#
#  Danach pruefen, dass wirklich gekuerzt wird:
#    curl -s -o /dev/null https://veraevents.de/
#    tail -n 1 /var/log/nginx/access.log
#  Erwartet: die letzte Stelle der Adresse ist 0 (z. B. 203.0.113.0).
# ---------------------------------------------------------------

# Letztes Byte der IPv4-Adresse auf 0 setzen, bei IPv6 die hinteren
# Gruppen verwerfen. Damit bleibt die Herkunft grob erkennbar (nützlich,
# wenn man einen Angriff nachvollziehen will), die einzelne Person aber
# nicht mehr.
map $remote_addr $ip_gekuerzt {
    ~(?<ipv4>\d+\.\d+\.\d+)\.    "$ipv4.0";
    ~(?<ipv6>[^:]+:[^:]+):       "$ipv6::";
    default                      "0.0.0.0";
}

log_format gekuerzt '$ip_gekuerzt - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
