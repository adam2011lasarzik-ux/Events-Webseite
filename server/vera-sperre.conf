# === VORUEBERGEHENDE SPERRE DER OEFFENTLICHEN WEBSEITE ===
#
# Abgelegt auf dem Server als /etc/nginx/conf.d/vera-sperre.conf
# Angelegt am 15.09.2026, damit vor dem Livegang keine fremden
# Besucher die Seite sehen oder Tickets kaufen koennen.
#
# VOR DEM ERSTEN ECHTEN EVENT WIEDER ENTFERNEN:
#   1. In /etc/nginx/sites-available/vera die zwei Zeilen
#      auth_basic und auth_basic_user_file loeschen
#   2. nginx -t && systemctl reload nginx
#   3. Diese Datei und /etc/nginx/.htpasswd-vera loeschen
#   4. Wache und UptimeRobot zurueck auf / stellen
#
# Drei Pfade bleiben absichtlich frei:
#   /zahlung/rueckmeldung  Stripe-Webhook, hat eigene Signaturpruefung
#   /.well-known/          Lets Encrypt, sonst laeuft das Zertifikat ab
#   /admin                 eigener Login mit 2FA, staerker als ein Passwort

map $uri $vera_sperre {
    default                  "VERA - noch nicht oeffentlich";
    ~^/zahlung/rueckmeldung  "off";
    ~^/\.well-known/         "off";
    ~^/admin(/|$)            "off";
}
