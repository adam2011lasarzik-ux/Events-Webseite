name: Vorschau auf GitHub Pages

# Baut die Webseite als reine HTML-Dateien (kein Server nötig) und
# veröffentlicht sie unter https://<konto>.github.io/Events-Webseite/.
#
# Nur eine Vorschau zum Anschauen — nicht der spätere Hostinger-Weg.
# Version 1 hat ohnehin keine Serverfunktionen (keine Datenbank, kein
# Formular-Versand), deshalb geht dabei nichts verloren.

on:
  push:
    branches:
      - claude/frontend-design-skill-folder-luremb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert, dass zwei Veröffentlichungen gleichzeitig laufen und
# sich gegenseitig überschreiben.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES_BUILD: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
