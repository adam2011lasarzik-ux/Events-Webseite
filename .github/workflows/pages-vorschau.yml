name: Vorschau auf GitHub Pages

# Baut die Webseite als reine HTML-Dateien (kein Server nötig) und
# veröffentlicht sie unter https://<konto>.github.io/Events-Webseite/.
#
# Nur eine Vorschau zum Anschauen — nicht der spätere Hostinger-Weg.
#
# Seit die Events aus der Datenbank kommen, braucht auch dieser Bau
# eine Datenbank. GitHub startet dafür unten kurzzeitig eine leere
# MySQL-Datenbank, füllt sie mit den Startdaten und baut daraus die
# Seiten. Kostet nichts und läuft nur während des Bauens.
#
# WICHTIG: Das Ergebnis ist ein Abzug vom Zeitpunkt des Bauens, keine
# laufende Datenbank. Anmeldungen sind hier nicht möglich — dafür
# braucht es den echten Server beim Hoster.

on:
  push:
    branches:
      - claude/frontend-design-skill-folder-luremb
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert, dass zwei Veröffentlichungen gleichzeitig laufen und
# sich gegenseitig überschreiben.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest

    # Kurzlebige Datenbank nur für diesen Bau. Die Zugangsdaten sind
    # bewusst belanglos: Diese Datenbank existiert nur wenige Minuten,
    # ist von außen nicht erreichbar und enthält ausschließlich die
    # öffentlichen Event-Daten aus prisma/seed.ts — niemals echte
    # Teilnehmerdaten.
    services:
      datenbank:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: nur-fuer-diesen-bau
          MYSQL_DATABASE: vera_vorschau
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: "mysql://root:nur-fuer-diesen-bau@127.0.0.1:3306/vera_vorschau"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Tabellen anlegen. `migrate deploy` statt `migrate dev`: es wendet
      # nur die vorhandenen Migrationsdateien an und braucht keine Rechte
      # zum Anlegen weiterer Datenbanken.
      - run: npx prisma migrate deploy

      # Event-Daten einspielen
      - run: npm run db:seed

      - run: npm run build
        env:
          GITHUB_PAGES_BUILD: "true"
          # Nur eine Hürde gegen zufällige Besucher, kein echter Schutz
          # (siehe components/VorschauSperre.tsx) — bei Bedarf hier
          # jederzeit änderbar.
          NEXT_PUBLIC_VORSCHAU_PASSWORT: "1234"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
